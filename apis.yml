  name: DPLA API Key Registration
  description: >-
    Self-service API key registration endpoint that issues free access keys via email. Developers submit
    their email address via HTTP POST and receive an API key by email. The key is then passed as the api_key
    query parameter or Authorization header on all subsequent Items API requests.
